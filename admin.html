<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script defer src="admin.js"></script>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .search-bar{
            width: 300px;
            display: flex;
            margin-bottom: -40px;
            margin-top: 12px;
            gap: 5px;
        }
        caption {
            font-size: 24px;
            margin-top: 12px;
            margin-left: 120px;
            border-bottom: 1px solid #2196f3;
        }

        .add-user-form {
            border: 1px solid #ddd;
            max-width: 400px;
            padding: 20px;
            border-radius: 8px;

        }

        .add-user-form div {
            margin-bottom: 15px;
        }

        .add-user-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .add-user-form input,
        .add-user-form select,
        .search-bar input,
        .search-bar button {
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            padding: 8px;
            width: 300px;
        }

        center {
            display: block;
            text-align: left;
            font-size: 24px;
            margin: 20px 12px;
        }

        .btn-container {
            gap: 10px;
            display: flex;
            margin-top: 20px;
            justify-content: flex-start;
        }

        .btn-container button,
        tbody button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        tbody button {

            font-size: 10px;
            padding: 6px 12px;
            margin: 3px 4px;
        }

        .add-user {
            background-color: #4cAf50;
            color: white;
        }

        .del-btn {
            background-color: #f44336;
            color: white;
        }

        .edit-btn {
            background-color: #2196f3;
            color: white;
        }

        .btn-container button:hover {

            opacity: 0.8;
            transform: translateY(2px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .active {
            color: #4cAf50;
        }

        .inactive {
            color: #f44336;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th {
            background-color: #ddd;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>

<body>
    <!-- ***************************************************************** -->
    <center>Admin Panel</center>
    <div class="js-add-user-form add-user-form">
        <div>
            <label for="name">Enter A Name</label>
            <input type="text" id="name" placeholder="Enter a Name">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email">
        </div>
        <div>
            <label for="role">Role</label>

            <select name="" id="role">
                <option value="employee">Employee</option>

                <option value="admin">Admin</option>
            </select>

        </div>
        <div class="btn-container js-btns">

            <button class="add-user">Add User</button>


        </div>
    </div>


    <!-- *************************************************************** -->
    <div class="user-list js-user-list">
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="search"> <button id="search-btn">Search</button>
        </div>
        <table border="1">
            <caption>Users List</caption>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
</body>

</html>
